server {
    listen 80;
    client_max_body_size 12m;
    location /api/ {
        proxy_pass http://backend-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
    location = /openapi.json { proxy_pass http://backend-api:8000/openapi.json; }
    location /docs { proxy_pass http://backend-api:8000/docs; }
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
