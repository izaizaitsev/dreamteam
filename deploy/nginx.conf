worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format proxy '$remote_addr $request_method $uri status=$status upstream=$upstream_status duration=$request_time';
    access_log /dev/stdout proxy;

    # Refresh Docker service addresses when application containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Caddy terminates HTTPS in production; local requests use nginx's scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache off;
        proxy_buffering off;

        set $backend http://backend:8000;
        set $frontend http://frontend:3000;

        # Preserve the entire original path and query, including /api and /health.
        location = /api {
            proxy_pass $backend$request_uri;
        }
        location ^~ /api/ {
            proxy_pass $backend$request_uri;
        }
        location = /health {
            proxy_pass $backend$request_uri;
        }
        location ^~ /health/ {
            proxy_pass $backend$request_uri;
        }
        location / {
            proxy_pass $frontend$request_uri;
        }
    }
}
