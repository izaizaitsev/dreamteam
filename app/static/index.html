<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-юрист по вопросам ЖКХ</title>
<style>
:root{font:15px/1.45 system-ui,sans-serif;color:#17232a;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#143547;color:white;padding:18px 28px;display:flex;align-items:center;gap:30px}header h1{font-size:20px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}button,.tab{cursor:pointer;border:1px solid #bac9d1;background:white;color:#173749;border-radius:7px;padding:9px 12px;font:inherit}button:hover,.tab:hover{background:#e7f1f3}nav button{background:transparent;color:white;border-color:#738d9d}nav button.active{background:#fff;color:#143547}main{max-width:1440px;margin:auto;padding:24px}section{background:white;border:1px solid #d8e1e5;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #152b3410}h2{font-size:22px;margin:0 0 16px}h3{font-size:17px;margin:18px 0 8px}p{margin:8px 0}small,.muted{color:#617780}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stack{display:grid;gap:12px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0}input,select,textarea{font:inherit;border:1px solid #b8c8d0;border-radius:7px;padding:9px;max-width:100%;background:white}textarea{width:100%;min-height:140px}input[type=file]{width:100%}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5eaed;vertical-align:top}tr:hover{background:#f7fafb}a{color:#075981;cursor:pointer}.pill{display:inline-block;background:#e7eef3;color:#30536a;border-radius:16px;padding:3px 9px;font-size:12px}.warning{background:#fff6da;border-left:4px solid #d79b1e;padding:10px}.error{background:#ffe7e5;border-left:4px solid #c64232;padding:10px}.success{background:#e5f5e9;border-left:4px solid #3b9c63;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f8;padding:12px;border-radius:7px}article{border:1px solid #e1e8eb;border-radius:8px;padding:12px;margin:8px 0}.bar{margin-left:auto}#notice{position:fixed;right:20px;bottom:20px;max-width:460px;z-index:4;box-shadow:0 5px 20px #0002}.hidden{display:none}@media(max-width:950px){.grid{grid-template-columns:1fr}header{display:block}nav{margin-top:12px}main{padding:12px}table{display:block;overflow:auto}}
</style></head><body>
<header><h1>AI-юрист по вопросам ЖКХ</h1><nav><button data-view="appeals" class="active">Обращения</button><button data-view="import">Импорт</button><button data-view="templates">Шаблоны</button><button data-view="index">Индекс</button><button data-view="audit">Журнал</button><button data-view="settings">Настройки</button></nav></header>
<main><div id="content"></div></main><div id="notice" class="hidden"></div>
<script>
let selected=null, view='appeals', currentRole='ADMIN';const content=document.getElementById('content');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notice(message,error=false){const n=document.getElementById('notice');n.textContent=message;n.className=error?'error':'success';setTimeout(()=>n.className='hidden',7000)}
async function api(path,method='GET',data){const headers={};let body;if(data!==undefined){headers['Content-Type']='application/json';body=JSON.stringify(data)}const key=sessionStorage.getItem('appKey');if(key)headers['X-API-Key']=key;let res=await fetch(path,{method,headers,body});if(res.status===401){const entered=prompt('Введите ключ доступа к приложению');if(entered){sessionStorage.setItem('appKey',entered);return api(path,method,data)}}let payload=await res.json();if(!res.ok)throw Error(payload.detail||res.statusText);return payload}
async function action(fn){try{await fn()}catch(e){notice(e.message,true)}}
function setView(next){view=next;selected=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function showSection(title,body){content.innerHTML='<section><h2>'+title+'</h2>'+body+'</section>'}
async function render(){try{if(view==='appeals')return selected?await detail():await appeals();if(view==='import')return imports();if(view==='templates')return await templates();if(view==='index')return await index();if(view==='audit')return await audit();if(view==='settings')return await settingsView()}catch(e){notice(e.message,true)}}
async function appeals(){const rows=await api('/api/appeals');showSection('Очередь обращений','<div class="row"><input id="search" placeholder="Поиск по тексту или ID"><button id="find">Найти</button><button id="refresh">Обновить</button></div><div id="list"></div>');document.getElementById('refresh').onclick=()=>render();document.getElementById('find').onclick=async()=>draw(await api('/api/appeals?q='+encodeURIComponent(document.getElementById('search').value)));draw(rows);function draw(data){document.getElementById('list').innerHTML='<table><thead><tr><th>ID</th><th>Источник</th><th>Тема</th><th>Заявитель</th><th>Срок</th><th>Статус</th></tr></thead><tbody>'+data.map(x=>'<tr data-id="'+esc(x.id)+'"><td><a>'+esc(x.external_id)+'</a></td><td>'+esc(x.source)+'</td><td>'+esc(x.title||x.text.slice(0,100))+'</td><td>'+esc(x.applicant_name)+'</td><td>'+esc(x.due_at)+'</td><td><span class="pill">'+esc(x.status)+'</span></td></tr>').join('')+'</tbody></table>'+(data.length?'':'<p class="muted">Нет обращений. Загрузите JSON на вкладке «Импорт».</p>');document.querySelectorAll('#list tr[data-id]').forEach(tr=>tr.onclick=()=>{selected=tr.dataset.id;detail()})}}
async function detail(){const a=await api('/api/appeals/'+selected),c=a.classification,d=a.draft;content.innerHTML='<div class="row"><button id="back">← К списку</button><button id="process">Запустить AI-анализ</button><button id="retrieve">Поиск похожих</button><button id="classify">Классифицировать</button><button id="load">Обновить контекст</button><button id="generate">Создать черновик</button></div><div class="grid"><section><h2>'+esc(a.title||a.external_id)+'</h2><p><span class="pill">'+esc(a.status)+'</span> '+esc(a.source)+'</p><p><small>Заявитель: '+esc(a.applicant_name)+' · Дом: '+esc(a.building_id)+' · Срок: '+esc(a.due_at)+'</small></p><h3>Текст обращения</h3><pre>'+esc(a.text)+'</pre>'+(a.error?'<p class="error">'+esc(a.error)+'</p>':'')+'</section><section><h2>AI-анализ</h2>'+(c?'<p>Нужен юрист: <b>'+(c.legal_required?'да':'нет')+'</b></p><p>Тип: '+esc(c.case_type)+' · Категория: '+esc(c.category?.name)+'</p><p>Уверенность: '+Math.round(c.confidence*100)+'%</p><p>'+esc(c.reasoning_summary)+'</p><h3>Нужные данные</h3>'+c.required_context.map(x=>'<p>'+esc(x.key)+' — '+esc(x.reason)+'</p>').join('')+c.warnings.map(x=>'<p class="warning">'+esc(x)+'</p>').join(''):'<p class="muted">Анализ ещё не выполнен.</p>')+'<h3>Контекст</h3>'+a.context.map(x=>'<article><b>'+esc(x.key)+'</b> · '+esc(x.status)+'<pre>'+esc(JSON.stringify(x.data,null,2))+'</pre><small>'+esc(x.source)+'</small></article>').join('')+'</section><section><h2>Похожие обращения</h2>'+a.similar_cases.map(x=>'<article><b>'+esc(x.external_id)+'</b> · '+esc(x.rerank_score)+'<p>'+esc(x.appeal_text)+'</p><details><summary>Решение</summary><pre>'+esc(x.decision_text||'Текст решения не приложен')+'</pre>'+ (x.decision_file_uri?'<p>'+esc(x.decision_file_uri)+'</p>':'')+'</details></article>').join('')+(a.similar_cases.length?'':'<p class="muted">Индекс пока пуст или поиск не запускался.</p>')+'</section></div><section><h2>Черновик и проверка</h2><div id="draft"></div></section><section><h2>История действий</h2>'+a.audit.map(x=>'<p><small>'+esc(x.created_at)+'</small> · '+esc(x.action)+' · '+esc(x.actor)+'</p>').join('')+'</section>';document.getElementById('back').onclick=()=>{selected=null;appeals()};for(const [id,path] of [['process','process'],['retrieve','retrieve'],['classify','classify'],['load','load-context'],['generate','generate-draft']])document.getElementById(id).onclick=()=>action(async()=>{notice('Выполняется '+path+'…');await api('/api/appeals/'+selected+'/'+path,'POST');notice('Этап завершён');await detail()});const target=document.getElementById('draft');if(!d){target.innerHTML='<p class="muted">Черновик появится после анализа обращения, которому требуется юрист.</p>';return}const aiDraft=JSON.parse(d.ai_payload);target.innerHTML='<p>Статус: <span class="pill">'+esc(d.status)+'</span> · Уверенность AI: '+Math.round(aiDraft.confidence*100)+'%</p>'+aiDraft.missing_information.map(x=>'<p class="warning">Нет данных: '+esc(x)+'</p>').join('')+aiDraft.warnings.map(x=>'<p class="warning">'+esc(x)+'</p>').join('')+'<label>Текст ответа<textarea id="draftText" style="min-height:320px" '+(d.status==='PENDING'?'':'readonly')+'>'+esc(d.edited_text)+'</textarea></label><div class="row"><input id="actor" placeholder="Имя проверяющего" value="'+esc(sessionStorage.getItem('actor')||'')+'"><button id="save">Сохранить</button><button id="approve">Одобрить</button><button id="reject">Отклонить</button></div><details><summary>Исходный текст AI</summary><pre>'+esc(aiDraft.full_text)+'</pre></details>';for(const id of ['save','approve','reject'])document.getElementById(id).disabled=d.status!=='PENDING';for(const id of ['save','approve','reject'])document.getElementById(id).onclick=()=>action(async()=>{const actor=document.getElementById('actor').value.trim();if(!actor)throw Error('Введите имя проверяющего');sessionStorage.setItem('actor',actor);const text=document.getElementById('draftText').value;if(id==='save')await api('/api/drafts/'+d.id,'PUT',{actor,text});else await api('/api/drafts/'+d.id+'/'+id,'POST',{actor,text});notice('Сохранено');await detail()})}
const baseDetail=detail;detail=async function(){await baseDetail();if(!selected)return;const state=await api('/api/appeals/'+selected);if(state.draft?.status!=='APPROVED')return;const target=document.getElementById('draft');target.insertAdjacentHTML('beforeend','<div class="row"><button id="exportDocx">Скачать Word</button><input id="decisionUri" placeholder="Путь к итоговому документу (необязательно)" value="'+esc(state.draft.document_uri||'')+'"><label><input type="checkbox" id="indexResolved"> Сразу индексировать</label><button id="resolved">Отметить решённым</button></div>');document.getElementById('exportDocx').onclick=()=>action(async()=>{const headers={};const key=sessionStorage.getItem('appKey');if(key)headers['X-API-Key']=key;const response=await fetch('/api/drafts/'+state.draft.id+'/export-docx',{headers});if(!response.ok)throw Error('Не удалось скачать Word');const blob=await response.blob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='response-'+state.draft.id+'.docx';link.click();URL.revokeObjectURL(url);await detail()});document.getElementById('resolved').onclick=()=>action(async()=>{const actor=document.getElementById('actor').value.trim();if(!actor)throw Error('Введите имя проверяющего');const result=await api('/api/appeals/'+selected+'/mark-resolved','POST',{actor,decision_file_uri:document.getElementById('decisionUri').value||null,index_now:document.getElementById('indexResolved').checked});notice(result.index_error||'Кейс сохранён');await detail()})};
const roleDetail=detail;detail=async function(){await roleDetail();if(currentRole==='OPERATOR')document.querySelectorAll('#process,#retrieve,#classify,#load,#generate,#save,#approve,#reject,#exportDocx,#resolved').forEach(button=>button.hidden=true)};
const caseDetail=detail;detail=async function(){
  await caseDetail();if(!selected)return;
  const data=await api('/api/appeals/'+selected);
  const cases=data.similar_cases.filter(item=>item.decision_file_uri);
  const panel=content.querySelector('.grid > section:nth-child(3)');if(!panel||!cases.length)return;
  panel.insertAdjacentHTML('beforeend','<h3>Word-файлы решений</h3>'+cases.map(item=>'<p><button class="caseDownload" data-case-id="'+esc(item.id)+'">Скачать '+esc(item.external_id)+'</button></p>').join(''));
  panel.querySelectorAll('.caseDownload').forEach(button=>button.onclick=()=>action(async()=>{
    const headers={};const key=sessionStorage.getItem('appKey');if(key)headers['X-API-Key']=key;
    const response=await fetch('/api/cases/'+encodeURIComponent(button.dataset.caseId)+'/decision-file',{headers});
    if(!response.ok)throw Error('Word-файл не загружен в систему; доступен только текст или внешний путь');
    const url=URL.createObjectURL(await response.blob());const link=document.createElement('a');link.href=url;
    link.download='resolved-'+button.dataset.caseId+'.docx';link.click();URL.revokeObjectURL(url);
  }));
};
function imports(){
  showSection('Импорт обращений',
    '<div class="grid">'+
      '<div><h3>1. Решённые обращения</h3><p class="muted">Загрузите JSON с external_id, appeal_text и полным утверждённым ответом в decision_text.</p><p><a href="/examples/resolved-cases.json" download>Скачать образец решённых обращений</a></p><input type="file" id="caseFile" accept=".json,application/json"><div class="row"><label><input type="checkbox" id="indexNow" checked> Сразу индексировать</label><button id="caseImport">Загрузить решённые</button></div></div>'+
      '<div><h3>2. Новые обращения</h3><p class="muted">После загрузки они появятся в разделе «Обращения».</p><p><a href="/examples/new-appeals.json" download>Скачать образец новых обращений</a></p><input type="file" id="appealFile" accept=".json,application/json"><div class="row"><button id="appealImport">Загрузить новые</button></div></div>'+
      '<div><h3>3. Word-файл решения</h3><p class="muted">Необязательно. Сначала загрузите JSON решённого обращения, затем укажите его external_id и прикрепите заполненный .docx. Текст Word станет текстом решения.</p><input id="decisionExternalId" placeholder="external_id решённого обращения"><input type="file" id="decisionFile" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><div class="row"><button id="decisionUpload">Прикрепить Word</button></div></div>'+
    '</div><h3>Отчёт</h3><pre id="report">Выберите файл и нажмите кнопку загрузки.</pre>');
  for(const [button,file,path] of [['appealImport','appealFile','appeals'],['caseImport','caseFile','resolved-cases']]){
    document.getElementById(button).onclick=()=>action(async()=>{
      const selectedFile=document.getElementById(file).files[0];if(!selectedFile)throw Error('Выберите JSON-файл');
      const data=JSON.parse(await selectedFile.text());
      const suffix=path==='resolved-cases'&&document.getElementById('indexNow').checked?'?index_now=true':'';
      const result=await api('/api/import/'+path+suffix,'POST',data);
      document.getElementById('report').textContent=JSON.stringify(result,null,2);notice('Импорт завершён');
    });
  }
  document.getElementById('decisionUpload').onclick=()=>action(async()=>{
    const externalId=document.getElementById('decisionExternalId').value.trim();
    const selectedFile=document.getElementById('decisionFile').files[0];
    if(!externalId||!selectedFile)throw Error('Укажите external_id и выберите .docx');
    const form=new FormData();form.append('file',selectedFile);
    const headers={};const key=sessionStorage.getItem('appKey');if(key)headers['X-API-Key']=key;
    const response=await fetch('/api/cases/decision-file?external_id='+encodeURIComponent(externalId),{method:'POST',headers,body:form});
    const result=await response.json();if(!response.ok)throw Error(result.detail||'Не удалось загрузить Word');
    document.getElementById('report').textContent=JSON.stringify(result,null,2);notice('Word-файл решения сохранён');
  });
}
async function templates(){const rows=await api('/api/templates');showSection('Шаблоны','<div class="grid"><div><h3>Новая версия шаблона</h3><div class="stack"><input id="code" placeholder="Код"><input id="name" placeholder="Название"><input id="category" placeholder="Код категории"><textarea id="body" placeholder="Текст шаблона"></textarea><button id="create">Сохранить версию</button></div></div><div style="grid-column:span 2"><h3>Доступные шаблоны</h3>'+rows.map(x=>'<article><b>'+esc(x.name)+'</b> · '+esc(x.code)+' · v'+x.version+' · '+(x.active?'активен':'неактивен')+'<pre>'+esc(x.body)+'</pre></article>').join('')+'</div></div>');document.getElementById('create').onclick=()=>action(async()=>{await api('/api/templates','POST',{code:document.getElementById('code').value,name:document.getElementById('name').value,category_code:document.getElementById('category').value||null,body:document.getElementById('body').value});notice('Шаблон сохранён');templates()})}
async function index(){const state=await api('/api/index/status'),config=await api('/api/config');showSection('Векторный индекс','<p>Решённых обращений: '+state.total+' · Индексировано: '+(state.indexed||0)+'</p><p>Embedding: '+esc(config.embedding_model)+' · Reranker: '+esc(config.reranker_model)+'</p><p>GigaChat: '+esc(config.gigachat_model)+' · '+(config.gigachat_configured?'ключ задан':'ключ не задан')+'</p><div class="row"><button id="upsert">Индексировать новые</button><button id="rebuild">Переиндексировать все</button></div><pre id="indexReport"></pre>');for(const id of ['upsert','rebuild'])document.getElementById(id).onclick=()=>action(async()=>{const data=await api('/api/index/'+id,'POST');document.getElementById('indexReport').textContent=JSON.stringify(data,null,2);notice('Индексация завершена')})}
async function settingsView(){const [config,embedding,reranker,db]=await Promise.all([api('/api/settings/gigachat'),api('/health/embedding'),api('/health/reranker'),api('/health/db')]);showSection('Настройки','<div class="grid"><div><h3>Ключ GigaChat</h3><p>Модель: '+esc(config.model)+'</p><p>Статус: <span class="pill">'+(config.configured?'ключ сохранён':'ключ не задан')+'</span></p><p class="muted">Введите Authorization key GigaChat. Ключ хранится в закрытом томе приложения и не показывается после сохранения.</p><input id="gigaKey" type="password" autocomplete="new-password" placeholder="Authorization key"><button id="saveGigaKey">Сохранить ключ</button></div><div><h3>Диагностика</h3><p>База данных: '+esc(db.status)+'</p><p>Embedding: '+esc(embedding.status)+'</p><p>Reranker: '+esc(reranker.status)+'</p><p class="muted">Модели могут загружаться несколько минут после первого запуска.</p></div></div>');document.getElementById('saveGigaKey').onclick=()=>action(async()=>{const key=document.getElementById('gigaKey').value.trim();if(!key)throw Error('Введите ключ GigaChat');await api('/api/settings/gigachat','PUT',{auth_key:key});document.getElementById('gigaKey').value='';notice('Ключ сохранён');await settingsView()})}
async function audit(){const rows=await api('/api/audit');showSection('Журнал действий','<table><tr><th>Время</th><th>Обращение</th><th>Действие</th><th>Пользователь</th><th>Детали</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.created_at)+'</td><td>'+esc(x.appeal_id)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.details)+'</td></tr>').join('')+'</table>')}
async function bootstrap(){await render();try{currentRole=(await api('/api/me')).role;if(currentRole!=='ADMIN')document.querySelectorAll('nav button:not([data-view="appeals"])').forEach(button=>button.hidden=true)}catch(e){notice(e.message,true)}}bootstrap();
</script></body></html>
